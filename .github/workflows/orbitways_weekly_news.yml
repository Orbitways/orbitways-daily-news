name: Orbitways Weekly News (RSS → PDF → Email)

on:
  schedule:
    # Every Monday at 07:00 UTC.
    # In Paris this is 08:00 in winter time and 09:00 in summer time.
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  run-weekly-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore seen_links.txt cache
        uses: actions/cache/restore@v4
        with:
          path: seen_links.txt
          key: seen-links-${{ runner.os }}-${{ hashFiles('seen_links.txt') }}
          restore-keys: |
            seen-links-${{ runner.os }}-

      - name: Generate local RSS feeds (web2rss)
        run: |
          mkdir -p rss
          python web2rss.py --config config/sites.csv --outdir rss

      - name: Generate PDF + send email (weekly digest)
        env:
          OW_SMTP_HOST: ${{ secrets.OW_SMTP_HOST }}
          OW_SMTP_PORT: ${{ secrets.OW_SMTP_PORT }}
          OW_SMTP_USER: ${{ secrets.OW_SMTP_USER }}
          OW_SMTP_PASS: ${{ secrets.OW_SMTP_PASS }}
          OW_MAIL_FROM: ${{ secrets.OW_MAIL_FROM }}
          # Optional fallback if config/newsletter_recipients.txt is missing or empty.
          OW_MAIL_TO: ${{ secrets.OW_MAIL_TO }}
        run: |
          mkdir -p output
          python orbitways_weekly_digest.py \
            --xlsx Feed.xlsx \
            --outdir output \
            --local-rss-dir rss \
            --days 7 \
            --recipients-file config/newsletter_recipients.txt

      - name: Upload PDF artifact (archive)
        uses: actions/upload-artifact@v4
        with:
          name: orbitways-weekly-news-${{ github.run_number }}
          path: output/*.pdf
          retention-days: 90

      - name: Debug seen_links.txt
        run: |
          echo "== seen_links.txt status =="
          ls -l seen_links.txt || true
          wc -l seen_links.txt || true
          tail -n 10 seen_links.txt || true

      - name: Save seen_links.txt cache
        uses: actions/cache/save@v4
        with:
          path: seen_links.txt
          key: seen-links-${{ runner.os }}-${{ hashFiles('seen_links.txt') }}
